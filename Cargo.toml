[workspace]
resolver = "2"
members = [
    "crates/lxst-core",
    "crates/lxst-codec2",
    "crates/lxst-embedded",
    "crates/lxst-rns",
    "crates/lxst-telephony",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license-file = "LICENSE"
rust-version = "1.89"
publish = false

[workspace.dependencies]
rmpv = "1"
thiserror = "2"
serde_json = "1"
hex = "0.4"
bytes = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
half = "2"
proptest = "1"
opus-rs = { version = "=0.1.42", default-features = false, features = ["heap"] }
serial_test = "3"

rns-crypto = { path = "../rsReticulum/crates/rns-crypto", version = "~1.5.1" }
rns-identity = { path = "../rsReticulum/crates/rns-identity", version = "~1.5.1" }
rns-interface = { path = "../rsReticulum/crates/rns-interface", version = "~1.5.1" }
rns-link = { path = "../rsReticulum/crates/rns-link", version = "~1.5.1" }
rns-runtime = { path = "../rsReticulum/crates/rns-runtime", version = "~1.5.1" }
rns-transport = { path = "../rsReticulum/crates/rns-transport", version = "~1.5.1" }
rns-wire = { path = "../rsReticulum/crates/rns-wire", version = "~1.5.1" }

lxst-core = { path = "crates/lxst-core", version = "0.4.0" }
lxst-rns = { path = "crates/lxst-rns", version = "0.4.0" }
