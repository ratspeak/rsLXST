name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  RSLXST_RSRETICULUM_VERSION: 1.1.0
  RSLXST_RSRETICULUM_COMMIT: cfb7253f99439367212744f322b72b549a44bc62

jobs:
  api-compat:
    name: Public API baseline
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: rsLXST
          fetch-depth: 0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RSLXST_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-01
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXST -> target
          cache-bin: true
      - name: Install API snapshot tool
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Check reviewed public API baseline
        run: python3 tools/check-api-baseline.py
        working-directory: rsLXST
      - name: Check manifest and feature contract
        run: python3 tools/check-api-manifest.py
        working-directory: rsLXST
      - name: Check additions-only compatibility floor
        run: python3 tools/check-api-compatibility.py
        working-directory: rsLXST
      - name: Check canonical and retained external consumers
        run: cargo check --manifest-path api-fixtures/Cargo.toml --locked
        working-directory: rsLXST

  lint:
    name: Lint and Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: rsLXST
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RSLXST_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: markqvist/LXST
          path: upstream/LXST
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: markqvist/Reticulum
          path: upstream/Reticulum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXST -> target
          cache-bin: false
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config libopus0 libogg0
      - run: cargo fmt --all -- --check
        working-directory: rsLXST
      - name: Check source-release contract
        run: python3 tools/check-source-release.py
        working-directory: rsLXST
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: rsLXST
      - name: Build embedding examples
        run: cargo build -p lxst-telephony --examples --locked
        working-directory: rsLXST
      - run: cargo doc --workspace --no-deps --locked
        working-directory: rsLXST
        env:
          RUSTDOCFLAGS: "-D warnings"

  desktop-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: rsLXST
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RSLXST_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: markqvist/LXST
          path: upstream/LXST
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: markqvist/Reticulum
          path: upstream/Reticulum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXST -> target
          cache-bin: false
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config libopus0 libogg0
      - name: Install macOS Opus runtime
        if: runner.os == 'macOS'
        run: brew install opus libogg
      - name: Install Python interop deps
        run: python -m pip install --upgrade pip && python -m pip install numpy cryptography pyserial cffi "audioop-lts; python_version >= '3.13'"
      - run: cargo test --workspace --locked
        working-directory: rsLXST

  msrv:
    name: Rust 1.87 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: rsLXST
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RSLXST_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: markqvist/LXST
          path: upstream/LXST
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: markqvist/Reticulum
          path: upstream/Reticulum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.87.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXST -> target
          cache-bin: false
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config libopus0 libogg0
      - name: Clippy (all targets and features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: rsLXST

  mobile-check:
    name: Clippy (${{ matrix.target }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-linux-android
            toolchain: stable
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            toolchain: stable
          - os: ubuntu-latest
            target: x86_64-linux-android
            toolchain: stable
          - os: macos-latest
            target: aarch64-apple-ios
            toolchain: stable
          - os: ubuntu-latest
            target: aarch64-linux-android
            toolchain: 1.87.0
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            toolchain: 1.87.0
          - os: ubuntu-latest
            target: x86_64-linux-android
            toolchain: 1.87.0
          - os: macos-latest
            target: aarch64-apple-ios
            toolchain: 1.87.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: rsLXST
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RSLXST_RSRETICULUM_COMMIT }}
          path: rsReticulum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rsLXST -> target
          cache-bin: false
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        if: contains(matrix.target, 'android')
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Clippy Android
        if: matrix.target == 'aarch64-linux-android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
        run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} --locked -- -D warnings
        working-directory: rsLXST
      - name: Clippy Android ARMv7
        if: matrix.target == 'armv7-linux-androideabi'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          AR_armv7_linux_androideabi: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_armv7_linux_androideabi: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          CXX_armv7_linux_androideabi: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang++
        run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} --locked -- -D warnings
        working-directory: rsLXST
      - name: Clippy Android x86_64
        if: matrix.target == 'x86_64-linux-android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          AR_x86_64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_x86_64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          CXX_x86_64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang++
        run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} --locked -- -D warnings
        working-directory: rsLXST
      - name: Clippy iOS
        if: matrix.target == 'aarch64-apple-ios'
        run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} --locked -- -D warnings
        working-directory: rsLXST
